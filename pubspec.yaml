name: file_pick_animation
description: A delightful interactive basketball shoot and drop file upload animation for Flutter apps with aiming trajectory, net swish physics, and progress bar.
version: 0.0.2
homepage: https://github.com/farzidahmed/file_pick_animations
repository: https://github.com/farzidahmed/file_pick_animations
issue_tracker: https://github.com/farzidahmed/file_pick_animations/issues

topics:
  - animation
  - file-picker
  - upload
  - ui
  - basketball

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
